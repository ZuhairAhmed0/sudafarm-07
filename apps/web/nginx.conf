server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 8.8.8.8 1.1.1.1 127.0.0.11 ipv6=off valid=30s;

    location /api/ {
        set $api_upstream https://sudafarm-api.onrender.com;
        proxy_pass $api_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name sudafarm-api.onrender.com;
        proxy_set_header Host sudafarm-api.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        set $static_upstream https://sudafarm-api.onrender.com;
        proxy_pass $static_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name sudafarm-api.onrender.com;
        proxy_set_header Host sudafarm-api.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
