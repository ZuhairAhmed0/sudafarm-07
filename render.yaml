services:
  # ---------------------------------------------------------
  # 1. Django Ninja API Service
  # ---------------------------------------------------------
  - type: web
    name: sudafarm-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://sudafarm-web.onrender.com,http://localhost:3000,http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,http://localhost:3000,http://localhost:5173

  # ---------------------------------------------------------
  # 2. React SPA Frontend Service (Nginx Reverse Proxy)
  # ---------------------------------------------------------
  - type: web
    name: sudafarm-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: BACKEND_URL
        value: https://sudafarm-api.onrender.com
